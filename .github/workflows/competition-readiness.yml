name: Competition readiness

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: korofarm
          POSTGRES_PASSWORD: korofarm
          POSTGRES_DB: korofarm_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U korofarm -d korofarm_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # APP_ENV must be explicit and recognized; CI runs as "test". No insecure auth bypass is enabled:
      # the browser stage signs in real test users through the guarded E2E auth stand-in.
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://korofarm:korofarm@localhost:5432/korofarm_ci_test
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://korofarm:korofarm@localhost:5432/korofarm_ci_test
      SUPABASE_URL: http://127.0.0.1:54999
      SUPABASE_PUBLISHABLE_KEY: e2e-test-key
      CORS_ORIGINS: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: src/frontend/package-lock.json }
      - run: python -m pip install -e "src/backend[dev]"
      - run: python -m pytest src/backend/tests -ra
      - run: npm ci
        working-directory: src/frontend
      - run: npm run lint && npx tsc --noEmit && npm run test
        working-directory: src/frontend
      - name: Production-configured build contains no test-only auth material
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://abcdefgh.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: npm run build && npm run check:bundle
      - name: Fresh database for browser E2E
        run: |
          # runner.temp is not available in job-level env; export the users file path for later steps.
          R1_E2E_USERS="$RUNNER_TEMP/r1-e2e-users.json"
          echo "R1_E2E_USERS=$R1_E2E_USERS" >> "$GITHUB_ENV"
          psql "postgresql://korofarm:korofarm@localhost:5432/korofarm_ci_test" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          python -m alembic -c src/backend/alembic.ini upgrade head
          python -m src.backend.scripts.seed_e2e "$R1_E2E_USERS"
      - name: Start test-only auth stand-in, API, exception worker and wait for health
        run: |
          KOROFARM_E2E_AUTH_STANDIN=1 node src/frontend/e2e/r1/support/auth-stub.mjs "$R1_E2E_USERS" 54999 > authstub.log 2>&1 &
          python -m uvicorn src.backend.app.main:app --host 127.0.0.1 --port 8100 > backend.log 2>&1 &
          # The capacity-exception spec relies on the worker turning outbox events into supply exceptions.
          WORKER_POLL_SECONDS=1 python -m src.backend.app.worker > worker.log 2>&1 &
          WORKER_PID=$!
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8100/health && curl --fail --silent http://127.0.0.1:54999/health && kill -0 "$WORKER_PID" && exit 0
            sleep 1
          done
          cat backend.log authstub.log worker.log
          exit 1
      - name: Build and start the E2E frontend
        working-directory: src/frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54999
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-test-key
        run: |
          npm run build
          npm run start -- -H 127.0.0.1 -p 3100 > frontend.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3100/login > /dev/null && exit 0
            sleep 1
          done
          cat frontend.log
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend
      - run: npm run test:e2e
        working-directory: src/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competition-evidence
          path: |
            src/frontend/artifacts
            backend.log
            authstub.log
            worker.log
            src/frontend/frontend.log

  # Deployment configuration (deploy/): images build, the backend image enforces the staging rules, and the API,
  # worker and migrations run from the image against PostgreSQL. Nothing is pushed or deployed.
  container-images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kf_stage_ci
          POSTGRES_PASSWORD: kf_stage_ci_only
          POSTGRES_DB: korofarm_stage_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kf_stage_ci -d korofarm_stage_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STAGE_DB: postgresql+psycopg://kf_stage_ci:kf_stage_ci_only@127.0.0.1:5432/korofarm_stage_ci
      PLACEHOLDER_SUPABASE: https://abcdefgh.supabase.co
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid with the template values
        run: docker compose -f deploy/compose.staging.yml --env-file deploy/.env.example config --quiet
      - name: Build the backend image
        run: docker build -f deploy/backend.Dockerfile -t korofarm-backend:ci .
      - name: Backend image refuses unsafe staging configuration
        run: |
          set +e
          docker run --rm -e APP_ENV=staging korofarm-backend:ci python -c "import src.backend.app.main"; [ $? -ne 0 ] || exit 1
          docker run --rm -e APP_ENV=staging -e SUPABASE_URL=$PLACEHOLDER_SUPABASE -e SUPABASE_PUBLISHABLE_KEY=x \
            -e DATABASE_URL=postgresql+psycopg://korofarm:korofarm@db.example.com/korofarm?sslmode=require \
            korofarm-backend:ci python -c "import src.backend.app.main"; [ $? -ne 0 ] || exit 1
          docker run --rm -e APP_ENV=staging -e SUPABASE_URL=$PLACEHOLDER_SUPABASE -e SUPABASE_PUBLISHABLE_KEY=x \
            -e DATABASE_URL=$STAGE_DB -e AGENT_MODEL_PROVIDER=nebius \
            korofarm-backend:ci python -c "import src.backend.app.main"; [ $? -ne 0 ] || exit 1
          echo "unsafe configurations refused"
      - name: Migrations, API and supervised worker run from the image
        run: |
          COMMON="--network host -e APP_ENV=staging -e SUPABASE_URL=$PLACEHOLDER_SUPABASE -e SUPABASE_PUBLISHABLE_KEY=x -e DATABASE_URL=$STAGE_DB"
          docker run --rm $COMMON korofarm-backend:ci python -m alembic -c src/backend/alembic.ini upgrade head
          docker run -d --name api $COMMON korofarm-backend:ci
          docker run -d --name worker --init --restart unless-stopped $COMMON -e WORKER_POLL_SECONDS=1 korofarm-backend:ci python -m src.backend.app.worker
          for attempt in $(seq 1 40); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health/worker || true)
            [ "$status" = "200" ] && break
            sleep 1
          done
          curl --fail -s http://127.0.0.1:8000/health
          curl --fail -s http://127.0.0.1:8000/health/worker
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/me)" = "401"
          docker run --rm $COMMON korofarm-backend:ci python -m src.backend.scripts.check_staging --api-url http://127.0.0.1:8000 || true
          # Supervision: crash the worker process (SIGKILL from inside, as an OOM kill would); Docker restarts the
          # container and monitoring recovers. (`docker kill` would count as a deliberate stop and suppress restarts.)
          docker exec worker python -c "import os; [os.kill(int(p), 9) for p in os.listdir('/proc') if p.isdigit() and int(p) not in (1, os.getpid()) and b'src.backend.app.worker' in open(f'/proc/{p}/cmdline', 'rb').read()]" || true
          sleep 8
          test "$(docker inspect -f '{{.RestartCount}}' worker)" -ge 1
          for attempt in $(seq 1 40); do
            curl --fail -s http://127.0.0.1:8000/health/worker && break
            sleep 1
          done
          curl --fail -s http://127.0.0.1:8000/health/worker
      - name: Logs
        if: always()
        run: docker logs api 2>&1 | tail -50; docker logs worker 2>&1 | tail -50
      - name: Build the frontend image with placeholder public settings
        run: |
          docker build -f deploy/frontend.Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=$PLACEHOLDER_SUPABASE \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder \
            -t korofarm-frontend:ci .
      - name: Images contain no environment files
        run: |
          # Build-context files land only in the application directories (/srv backend, /app frontend).
          status=0
          for image in korofarm-backend:ci korofarm-frontend:ci; do
            found=$(docker run --rm --entrypoint sh "$image" -c 'for d in /srv /app; do [ -d "$d" ] && find "$d" \( -name ".env" -o -name ".env.*" \) ! -name ".env.example" -not -path "*/node_modules/*"; done; true')
            if [ -n "$found" ]; then echo "::error::environment file in $image: $(echo $found)"; status=1; fi
          done
          exit $status

[project]
name = "korofarm"
version = "0.1.0"
description = "Caribbean Agricultural Supply Assurance platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "pyjwt[crypto]>=2.9",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]
# Optional recovery-agent model providers (agents/infrastructure/providers.py). Development and staging only;
# production model access stays disabled until approved. Not needed for development, tests or CI.
# MiniMax and Nebius Token Factory use the OpenAI-compatible SDK both providers document.
model = [
    "openai>=3.0,<4",
]
# The optional, disabled-by-default Anthropic adapter.
anthropic = [
    "anthropic>=2.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ledger_drift_expected: the test deliberately sets a lot's reserved quantity outside the ledger",
]

[tool.ruff]
line-length = 100
